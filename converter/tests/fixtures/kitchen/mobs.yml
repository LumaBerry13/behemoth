# Made-up MythicMobs mob for converter tests (not from any purchased pack).
kitchen_boss:
  Type: ZOMBIE
  Display: 'Kitchen Sink'
  Health: 150
  Drops:
  - DIAMOND 1-3 0.5
  - Kitchen_Gem 2
  - exp 50
  Damage: 4
  Variables:
    mood: string/calm
    power: float/0
  DamageModifiers:
  - FALL 0
  - POISON -1
  Options:
    FollowRange: 24
  Modules:
    ThreatTable: true
  Skills:
  - skill{s=ks_opener} @self ~onSpawn
  - skill{s=ks_rotation} @target ~onTimer:40
  - skill{s=ks_poke} @trigger ~onInteract
  - skill{s=ks_pong} @self ~onSignal:pong
  - skill{s=ks_react} @trigger ~onDamaged 0.5
  - skill{s=ks_enrage} @self ~onDamaged <50%
  - skill{s=ks_greet} @trigger ~onCombat
  - skill{s=ks_resume} @self ~onLoad
  - skill{s=ks_mind} @target ~onTimer:20
  - SudoSkill{s=ks_bleed} @trigger ~onDamaged
  - skill{s=ks_grab_bite} @target ~onTimer:30
  - skill{s=ks_steel} @self ~onTimer:40

# A made-up effect mob summoned by the boss (converted in the same job as a minion).
kitchen_spark:
  Type: ARMOR_STAND
  Display: 'Spark'
  Health: 5
  Options:
    NoAI: true
    Invincible: true
  Skills:
  - matchrotation @parent ~onSpawn
  - remove{delay=40} @self ~onSpawn
  - damage{a=1} @PlayersInRadius{r=1} ~onTimer:10

# Invisible effect mob without a model folder: folder mode generates an empty entity for it.
kitchen_puddle:
  Type: CHICKEN
  Display: '&aPuddle'
  Health: 10
  Options:
    Invisible: true
    MovementSpeed: 0
  Skills:
  - skill{s=ks_puddle} @self ~onSpawn
