# Made-up metaskills covering the mechanics/targeters/conditions the converter maps.
ks_opener:
  Skills:
  - sendtitle{title="Kitchen";subtitle="sink";fadein=5;stay=40;fadeout=10} @PlayersInRadius{r=30}
  - actionmessage{m="ready"} @PlayersInRadius{r=30}
  - setvariable{var=stage;value=1} @self
  - particlesphere{p=flame;r=2;a=30} @self

ks_rotation:
  Conditions:
  - lineofsight true
  - playerswithin{d=20;a=>0} true
  - height{h=>-64} true
  Skills:
  - randomskill{s=ks_bolt,ks_storm,ks_dash,ks_grab} @target

ks_bolt:
  Cooldown: 3
  Skills:
  - projectile{onHit=ks_bolt_hit;v=16;md=30;hr=1;particle=flame} @target
  - particleline{p=crit;db=0.5} @target

ks_bolt_hit:
  Skills:
  - damage{a=4}
  - ignite{ticks=40}
  - percentdamage{p=0.1}

ks_storm:
  Cooldown: 6
  Skills:
  - lightning @Ring{radius=5;points=4}
  - particlering{p=smoke;r=5;points=24} @self
  - particle{p=flame;a=3} @modelpart{pid=arm;o=model;y=0.5}

ks_dash:
  Conditions:
  - variableequals{var=stage;value=1} true
  Skills:
  - lunge{v=1.2;vy=0.1} @target
  - velocity{mode=ADD;vy=0.5} @self
  - heal{a=5} @self
  - healpercent{m=0.05} @self

ks_grab:
  Skills:
  - pull{v=8} @Cone{a=90;r=8}
  - teleport @target
  - variableadd{var=stage;a=1} @self
  - signal{s=pong} @self

ks_poke:
  Skills:
  - sendmessage{m="hey"} @trigger

ks_pong:
  Skills:
  - particle{p=heart;a=5;hs=0.5;y=2} @ThreatTable

# --- variables, placeholders, condition actions, target conditions, inline skills ---
ks_react:
  Cooldown: 1
  Skills:
  - setvar{var=caster.mood;val=angry;type=STRING;duration=100} @self
  - variablemath{var=caster.power;eq="min(10, x + <caster.var.power> + 1)"} @self
  - sound{s=mob.blaze.hit;p="<random.float.0.9to1.2>";cd=2} @self
  - taunt @trigger

ks_enrage:
  Skills:
  - barcreate{name="ks";display="<caster.name> (angry)"} @self
  - tint{c=#FF6969} @self
  - tint{c=#FFFFFF;delay=2} @self
  - explosion{y=2} @selflocation
  - jump{v=1} @self

ks_greet:
  Conditions:
  - incombat true
  Skills:
  - sendmessage{m="Welcome <trigger.name>"} @trigger

ks_resume:
  Skills:
  - particle{p=heart;a=2} @self

ks_mind:
  Conditions:
  - varequals{var=caster.mood;val=angry} castinstead ks_angry
  - variableisset{var=caster.power} true
  TargetConditions:
  - fieldofview{angle=90;r=0} orelsecast ks_turn
  - onground true
  Skills:
  - basedamage{m=1.5} @target
  - shoot{type=ARROW;v=6} @target
  - summon{m=kitchen_spark;a=1} @RandomLocationsNearCaster{a=3;r=6;minr=2;s=2}

ks_angry:
  Skills:
  - raytraceto{md=20;w=1;entitySkill=[ - damage{a=2} - throw{v=3;vy=2} ];locationSkill=[ - particle{p=explosion} @origin ]} @target
  - projectile{v=10;oT=[ - modifyprojectile{trait=VELOCITY;action=MULTIPLY;value=1.05} - particle{p=flame} @origin ];oH=ks_bolt_hit;oE=[ - summon{m=kitchen_spark} ];bulletModel=7;md=20} @target
  - velocity{m=add;x=0.2;r=true;repeat=4;repeati=2} @self
  - stun{d=20} @self
  - forcepull @target
  - swap @target
  - sethealth{a=100} @self
  - command{c="say hi"} @self
  - setrotation{yaw=10;relative=true} @self ?!varequals{var=caster.mood;val=calm}

ks_turn:
  Skills:
  - setrotation{yaw=180;relative=true} @self
